[setup]
llm_repo_id = "unsloth/Qwen3.5-4B-GGUF"
llm_file_name = "Qwen3.5-4B-UD-Q4_K_XL.gguf"
model_folder = "static/models"


[logs]
log_path = "./logs/app/app.log"


[phoenix]
data_dir = "./logs/phoenix_data"


[server]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:5173"]


[llm_engine]
n_ctx = 12000
n_gpu_layers = -1
max_tokens = 5000
max_retries = 3


[database]
db_path = "./storage/database/database.db"


[embedding]
repo = "Alibaba-NLP/gte-multilingual-base"
batch_size = 32
max_length = 1024
dim = 768


[vectordb]
vector_db_path = "./storage/vectordb"

[graphdb]
graph_db_path = "./storage/graph/graph_db.pkl.gz"
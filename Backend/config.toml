[llm]
url="https://openrouter.ai/api/v1/chat/completions"
provider="OpenRouter"
model="nvidia/nemotron-3-ultra-550b-a55b:free"
max_retries=2

[logs]
log_path = "./logs/app/app.log"

[phoenix]
data_dir = "./logs/phoenix_data"

[server]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:5173"]

[database]
db_path = "./storage/database/database.db"

[embedding]
url = "https://openrouter.ai/api/v1/embeddings"
model = "nvidia/llama-nemotron-embed-vl-1b-v2:free"
batch_size = 32
max_retries = 2
concurrency = 8

[vectordb]
vector_db_path = "./storage/vectordb"

[graphdb]
graph_db_path = "./storage/graph/graph_db.pkl.gz"

[orchestrator]
workspace_base = "./storage/sandboxes"
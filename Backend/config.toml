[llm]
model="nvidia/nemotron-3-ultra-550b-a55b:free"
url="https://openrouter.ai/api/v1/chat/completions"
provider="OpenRouter"
max_retries=2
timeout_sec = 600
structured_mode = "json_object"

[logs]
log_path = "./logs"
level = "INFO"
rotation = "10 MB"
retention = "7 days"

[server]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:5173"]

[database]
table_name = "traces"

[storage]
bucket = "trace-logs"

[embedding]
url = "https://openrouter.ai/api/v1/embeddings"
model = "nvidia/llama-nemotron-embed-vl-1b-v2:free"
batch_size = 32
max_retries = 2
concurrency = 8
timeout_sec = 60

[orchestrator]
workspace_base = "./storage/sandboxes"
max_retries = 2
sandbox_image = "python:3.12-slim"
sandbox_timeout_sec = 30